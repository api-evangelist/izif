aid: izif
name: Izif
description: Izif (إعزف) is an online music education platform for the Arabic-speaking world, positioning
  itself as the largest platform for teaching music in Arabic. It offers a subscription library of more
  than 2,000 instructional videos across roughly ten popular Arabic instruments — oud, guitar, violin,
  piano, ney, darbuka, qanun, vocals, and music theory — taught by elite Arab musicians, alongside music
  sheets and iOS/Android apps. A 500 Global portfolio company, Izif is a consumer EdTech subscription
  service and publishes no public API, developer portal, or SDK at this time.
